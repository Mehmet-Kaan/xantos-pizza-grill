<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <script>
      (function () {
        // Check if we are on the admin path
        const isAdmin = window.location.pathname.includes("/admin");
        const manifestFile = isAdmin
          ? "/manifest-admin.json"
          : "/manifest.json";

        // Create the link tag dynamically
        const link = document.createElement("link");
        link.rel = "manifest";
        link.href = manifestFile;

        // Append it to the head
        document.head.appendChild(link);
        console.log("Loaded manifest:", manifestFile);
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Xanthos Pizza" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Xanthos Pizza & Grill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
