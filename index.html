<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <script>
      function applyAdminManifest() {
        // Check if we are currently on the admin path
        if (window.location.pathname.includes("/admin")) {
          // Look for the manifest link and swap it immediately
          const link = document.querySelector('link[rel="manifest"]');
          if (link) {
            link.setAttribute("href", "/manifest-admin.json");
          }
        }
      }
      // Run it immediately
      applyAdminManifest();
      // Also run it when the DOM is fully ready just in case
      window.addEventListener("DOMContentLoaded", applyAdminManifest);
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Xanthos Pizza" />
    <link rel="apple-touch-icon" href="/icon.png" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Xanthos Pizza & Grill</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
